name: Kurswerk Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "engine.js", "bot/**", "user/bot_settings.json", "user/manual_state.json", ".github/workflows/bot.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kurswerk-bot
  cancel-in-progress: false

jobs:
  runde:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Letzten Stand laden
        run: |
          mkdir -p /tmp/prev
          if git fetch --depth=1 origin state 2>/dev/null; then
            git archive FETCH_HEAD data | tar -x -C /tmp/prev
            echo "Stand aus Zweig 'state' geladen"
          else
            echo "Erster Lauf: Startdaten aus dem Ordner data werden verwendet"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kurse holen und Bot handeln lassen
        env:
          STATE_IN: /tmp/prev/data
          OUT_DIR: ${{ github.workspace }}/site/data
          USER_DIR: ${{ github.workspace }}/user
        run: node bot/run.mjs

      - name: Webseite zusammenstellen
        run: |
          cp index.html engine.js manifest.webmanifest icon.svg icon-192.png site/
          touch site/.nojekyll
          for f in user/*.json; do [ -f "$f" ] && cp "$f" "site/data/$(basename "$f")"; done
          ls site/data

      - name: Stand sichern (Zweig 'state', ohne Verlauf)
        run: |
          cd site
          git init -q -b state
          git config user.name "kurswerk-bot"
          git config user.email "kurswerk-bot@users.noreply.github.com"
          git add data
          git commit -q -m "Bot-Stand $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
